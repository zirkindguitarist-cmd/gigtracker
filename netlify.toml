[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/gigs"
  to = "/.netlify/functions/gigs"
  status = 200

[[redirects]]
  from = "/api/invoice"
  to = "/.netlify/functions/invoice"
  status = 200

[[redirects]]
  from = "/api/pub"
  to = "/.netlify/functions/pub"
  status = 200

[[redirects]]
  from = "/api/site"
  to = "/.netlify/functions/site"
  status = 200

[functions.remind]
  schedule = "0 13 * * *"
