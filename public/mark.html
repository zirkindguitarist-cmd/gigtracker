<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Mark paid</title>
<style>.bsd{text-align:right;color:#5a544c;font-size:17px;line-height:1;margin:0 4px 8px}body{margin:0;background:#f4f1ec;color:#1d1b19;font:16px/1.45 system-ui,-apple-system,sans-serif}.w{max-width:480px;margin:0 auto;padding:16px}
.c{background:#fff;border-radius:14px;padding:22px;box-shadow:0 1px 6px #0001}h1{font-size:22px;margin:0 0 8px}button{font:inherit;border:0;border-radius:10px;padding:14px;background:#1f9d55;color:#fff;width:100%;margin-top:16px;font-weight:600}</style></head>
<body><div class="w"><div class="bsd" dir="rtl" lang="he">בס״ד</div><div class="c" id="o">Loading…</div></div><script>
const q=new URLSearchParams(location.search),o=document.getElementById("o"),u="/api/invoice?id="+encodeURIComponent(q.get("id")||"")+"&t="+encodeURIComponent(q.get("t")||"");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const show=g=>{const bal=(+g.fee||0)-(+g.deposit||0);
 o.innerHTML="<h1>"+esc(g.title)+"</h1><div>"+esc(g.client)+" · "+esc(g.date)+"</div><div style='margin:10px 0'>Balance due: <b>$"+bal.toLocaleString()+"</b></div>"+
 (g.paid?"<div style='color:#1f9d55;font-weight:700'>✓ Marked paid "+esc(g.paidDate)+"</div>":"<button id='b'>Mark as paid</button>");
 const b=document.getElementById("b");if(b)b.onclick=async()=>{b.disabled=true;const r=await fetch(u,{method:"POST"});r.ok?show(await r.json()):(b.disabled=false,alert("Couldn't save. Try again."))}};
fetch(u).then(async r=>r.ok?show(await r.json()):o.textContent="This link isn't valid.").catch(()=>o.textContent="Couldn't load.");
</script></body></html>
