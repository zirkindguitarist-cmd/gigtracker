let gigs=[],db=null,showPast=false,col=null;
const TY=["Wedding","Bar Mitzvah","Chabad House event","Achnasas Sefer Torah","Other"];
const F=[["type","Event type","sel"],["date","Date","date"],["start","Start","time"],["end","End","time"],["venue","Venue"],["address","Address"],["client","Client name"],["phone","Client phone"],["email","Client email"],["fee","Fee ($)","number"],["deposit","Deposit received ($)","number"],["notes","Notes (setlist, load-in, contact on site…)","area"]];

function render(){
 const t=today(),L=gigs.filter(g=>showPast?g.date<t:g.date>=t).sort((a,b)=>showPast?b.date.localeCompare(a.date):(a.date+(a.start||"")).localeCompare(b.date+(b.start||"")));

function ics(g){
