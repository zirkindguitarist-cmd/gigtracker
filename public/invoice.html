function pdf(g){
 const J=window.jspdf;if(!J){alert("PDF library didn't load. Check your connection.");return}
 const p=new J.jsPDF({unit:"pt",format:"letter"}),fee=+g.fee||0,dep=+g.deposit||0,n="INV-"+g.date.replace(/-/g,"")+"-"+g.id.slice(-3).toUpperCase();

async function sharePdf(name,data){
 const blob=new Blob([data],{type:"application/pdf"});
 try{if(navigator.canShare){const f=new File([blob],name,{type:"application/pdf"});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}}catch(e){if(e&&e.name==="AbortError")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
