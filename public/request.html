<p class="m">Please fill out this form with your event details.</p>
<div id="f">
<label>Your name *</label><input id="name" autocomplete="name">
<div class="r"><div><label>Phone</label><input id="phone" type="tel" autocomplete="tel"></div><div><label>Email</label><input id="email" type="email" autocomplete="email"></div></div>
<p class="m" style="margin:4px 0 0">Please give a phone number or email.</p>
<label>Event type</label><select id="type"><option>Wedding</option><option>Bar Mitzvah</option><option>Chabad House event</option><option>Achnasas Sefer Torah</option><option>Other</option></select>

<label>Comments</label><textarea id="notes" rows="5"></textarea>
<div class="hp"><label>Website</label><input id="website" tabindex="-1" autocomplete="off"></div>
<button id="go">Send request</button><p id="err" style="color:#d64545"></p>

<script>
const $=id=>document.getElementById(id);
$("type").onchange=e=>{$("typeo").style.display=e.target.value==="Other"?"block":"none"};
$("go").onclick=async()=>{
 const b={};for(const k of["name","phone","email","date","start","venue","address","notes","website"])b[k]=$(k).value;
 b.type=$("type").value==="Other"?($("typeo").value.trim()||"Other"):$("type").value;
 if(!b.name.trim()||!b.date||(!b.phone.trim()&&!b.email.trim())){$("err").textContent="Please fill in your name, the date, and a phone number or email.";return}
 $("go").disabled=true;$("err").textContent="";
